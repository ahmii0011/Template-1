<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Muhtarma Vibe Vault 🗝️✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #120c1f, #2b103a, #1a0b2e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }
        .vault-container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 10;
        }
        .vault-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .vault-header h1 {
            font-size: 22px;
            background: linear-gradient(to right, #ffafbd, #ffc3a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .vault-header p {
            font-size: 12px;
            color: #b8b8b8;
        }
        /* Navigation System */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 20px;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 11px;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
            text-align: center;
            transition: all 0.3s ease;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #f72585, #b5179e);
            color: white;
            box-shadow: 0 4px 15px rgba(247, 37, 133, 0.4);
        }
        /* Content Sections */
        .section-box {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .section-box.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .display-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 22px;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #f1f1f1;
        }
        .custom-btn {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            transition: transform 0.2s;
        }
        .custom-btn:active {
            transform: scale(0.97);
        }
        /* Vibe Meter Style */
        .meter-container {
            text-align: center;
        }
        .meter-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            height: 14px;
            width: 100%;
            margin: 15px 0;
            overflow: hidden;
            position: relative;
        }
        .meter-fill {
            background: linear-gradient(90deg, #f72585, #4cc9f0);
            height: 100%;
            width: 0%;
            border-radius: 20px;
            transition: width 1s ease-in-out;
        }
        /* Floating particles */
        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 3s linear infinite;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.6); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="vault-container">
        <div class="vault-header">
            <h1>🗝️ Muhtarma Vibe Vault</h1>
            <p>Aesthetic Portal & Secret Corner 🌸</p>
        </div>

        <div class="nav-bar">
            <button class="nav-btn active" onclick="switchTab('notes', this)">💌 Notes</button>
            <button class="nav-btn" onclick="switchTab('vibe', this)">📊 Vibe Meter</button>
            <button class="nav-btn" onclick="switchTab('challenges', this)">🎯 Fun Task</button>
        </div>

        <!-- Notes Section -->
        <div id="notes" class="section-box active">
            <div class="display-card" id="noteDisplay">
                Suno Muhtarma... Aapka hona hi ek positive vibe hai! 🌙✨
            </div>
            <button class="custom-btn" onclick="nextNote()">✨ Agla Secret Note</button>
        </div>

        <!-- Vibe Meter Section -->
        <div id="vibe" class="section-box">
            <div class="display-card meter-container">
                <div>Aaj ka Muhtarma Vibe Check: <br><strong id="vibeResult" style="color: #ffafbd; font-size: 18px;">Click below to test! 🚀</strong></div>
                <div class="meter-bar">
                    <div class="meter-fill" id="meterFill"></div>
                </div>
            </div>
            <button class="custom-btn" onclick="runVibeCheck()">💖 Run Vibe Check</button>
        </div>

        <!-- Challenges / Fun Task Section -->
        <div id="challenges" class="section-box">
            <div class="display-card" id="taskDisplay">
                Tap button to get a cute daily task! 👇
            </div>
            <button class="custom-btn" onclick="nextTask()">🎯 New Cute Task</button>
        </div>
    </div>

    <script>
        const secretNotes = [
            "Suno Muhtarma... Aapka hona hi ek positive vibe hai! 🌙✨",
            "Aapki baaton mein aisi ajeeb si khichav aur sukoon hai. ☕🤍",
            "Duniya chahe jaisi bhi ho, aapki smile hamesha on honi chahiye! 🌸",
            "Kabhi socha nahi tha ke koi itna random hokar bhi itna special ban sakta hai! 🦋"
        ];

        const funTasks = [
            "Task 1: Ek lambi saans lo aur saari tension bhool jao! 🧘‍♀️✨",
            "Task 2: Abhi ke abhi ek pyaari si smile paas karo! 😊💖",
            "Task 3: Paani ka ek glass piyo jaldi se! 💧🧊",
            "Task 4: Khud ke liye ek cup chai ya coffee order karo! ☕🍰"
        ];

        const vibeLevels = [
            "100% Supreme Queen Energy! 👑✨",
            "Infinity % Cute & Aesthetic! 🌸💖",
            "99.9% Killer Smile Vibe! 😍🔥",
            "1000% Peaceful & Positive! 🌙🕊️"
        ];

        let noteIdx = 0;
        let taskIdx = 0;

        function switchTab(tabId, btn) {
            document.querySelectorAll('.section-box').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function nextNote() {
            noteIdx = (noteIdx + 1) % secretNotes.length;
            updateText("noteDisplay", secretNotes[noteIdx]);
            spawnSparkle("✨");
        }

        function nextTask() {
            taskIdx = (taskIdx + 1) % funTasks.length;
            updateText("taskDisplay", funTasks[taskIdx]);
            spawnSparkle("🎯");
        }

        function runVibeCheck() {
            const randomVibe = vibeLevels[Math.floor(Math.random() * vibeLevels.length)];
            document.getElementById("vibeResult").innerText = randomVibe;
            document.getElementById("meterFill").style.width = "100%";
            spawnSparkle("💖");
        }

        function updateText(elementId, text) {
            const el = document.getElementById(elementId);
            el.style.opacity = 0;
            setTimeout(() => {
                el.innerText = text;
                el.style.opacity = 1;
            }, 200);
        }

        function spawnSparkle(symbol) {
            const s = document.createElement("div");
            s.classList.add("sparkle");
            s.innerHTML = symbol;
            s.style.left = Math.random() * window.innerWidth + "px";
            s.style.animationDuration = (Math.random() * 2 + 2) + "s";
            s.style.fontSize = (Math.random() * 8 + 16) + "px";
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 3000);
        }

        document.getElementById("noteDisplay").style.transition = "opacity 0.2s ease";
        document.getElementById("taskDisplay").style.transition = "opacity 0.2s ease";
    </script>
</body>
</html>
